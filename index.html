<meta name="theme-color" content="#2a2320">

<title>CARTELS! — A Computational Classnotes Comic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e23b2e;--yel:#ffd23f;--blu:#1f5fbf;--cya:#3fb6d9;--ink:#111;--paper:#fffaf0;--W:640px;--H:960px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:#2a2320;overflow:hidden;font-family:'Comic Neue','Comic Sans MS',cursive;color:var(--ink)}
body{background:radial-gradient(circle,rgba(255,255,255,.06) 1.5px,transparent 1.7px) 0 0/10px 10px,#2a2320}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stageWrap{flex:1;width:100%;position:relative;min-height:0}
#stage{width:var(--W);height:var(--H);position:absolute;left:50%;top:50%;transform-origin:center center;perspective:2400px}
.page{position:absolute;inset:0;background:var(--paper);transform-origin:left center;transition:transform .8s cubic-bezier(.45,.05,.3,1);contain:layout paint;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);padding:22px 22px 40px;display:flex;flex-direction:column;overflow:hidden;border-radius:2px 6px 6px 2px}
.page::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 4%,rgba(0,0,0,0) 96%,rgba(0,0,0,.08));z-index:5}
.page.flipped{transform:rotateY(-178deg);box-shadow:none}
.page.flipping::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.25));pointer-events:none;z-index:6}
.foot{position:absolute;left:22px;right:22px;bottom:12px;display:flex;justify-content:space-between;font:700 11px 'Comic Neue',cursive;color:#444;letter-spacing:.02em}
.foot b{font-family:Bangers;font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--ink)}

/* grid + panels */
.grid{flex:1;display:grid;gap:12px;min-height:0}
.panel{position:relative;border:4px solid var(--ink);background:#fff;overflow:hidden;min-height:0}
.dots{background:radial-gradient(circle,rgba(0,0,0,.16) 1.6px,transparent 1.8px) 0 0/9px 9px}
.bg-yel{background-color:var(--yel)}.bg-cya{background-color:#bfe9f5}.bg-red{background-color:#f6b3a9}.bg-blu{background-color:#cfdcf7}.bg-cream{background-color:#fff1c9}
.night{background:radial-gradient(circle,rgba(255,255,255,.10) 1.6px,transparent 1.8px) 0 0/9px 9px,linear-gradient(#1b2350,#3a1f4f)}

.title-panel{background:var(--red);display:flex;align-items:center;gap:14px;padding:8px 14px;color:#fff}
.title-panel .num{font-family:Bangers;font-size:22px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);padding:2px 10px;transform:rotate(-4deg);white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.title-panel h2{margin:0;font-family:Bangers;font-weight:400;font-size:38px;line-height:.95;letter-spacing:.03em;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.title-panel .meta{font:700 13px 'Comic Neue';margin-top:4px;color:#fff;text-shadow:1px 1px 0 var(--ink)}

.caption{position:absolute;background:var(--yel);border:3px solid var(--ink);padding:5px 9px;font:700 13px/1.25 'Comic Neue';box-shadow:3px 3px 0 var(--ink);z-index:3;max-width:88%}
.caption.tl{top:8px;left:8px}.caption.br{bottom:8px;right:8px}.caption.bl{bottom:8px;left:8px}

/* figure panel */
.figpanel{display:flex;align-items:center;justify-content:center}
.burst{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.75) 0 7deg,rgba(255,255,255,0) 7deg 15deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.figpanel a{position:relative;z-index:2;display:block}
.figpanel img{width:170px;height:170px;display:block;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg)}
.sfx{position:absolute;z-index:3;font-family:Bangers;font-size:50px;color:var(--yel);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);letter-spacing:.03em;transform:rotate(-12deg);pointer-events:none;white-space:nowrap}
.sfx.red{color:var(--red)}.sfx.cy{color:#7fe0ff}

/* bubbles */
.bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 14px;font:700 15.5px/1.3 'Comic Neue';z-index:4}
.bubble[class*="t-"]::before,.bubble[class*="t-"]::after{content:'';position:absolute;width:30px;height:28px}
.bubble::before{background:var(--ink);clip-path:polygon(0 0,100% 0,15% 100%)}
.bubble::after{background:#fff;clip-path:polygon(0 0,100% 0,15% 100%);width:22px;height:20px}
.t-bl::before{bottom:-28px;left:34px}.t-bl::after{bottom:-19px;left:38px}
.t-br::before{bottom:-28px;right:34px;transform:scaleX(-1)}.t-br::after{bottom:-19px;right:38px;transform:scaleX(-1)}
.bubble.whisper{border-style:dashed;font-style:italic;font-weight:700;background:#f4f4ff}
.bubble.whisper::after{background:#f4f4ff}
.bubble.whisper::before{background:repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 9px)}
.bubble.robot{border-radius:6px;background:#eafcff;font-family:'Comic Neue';}
.bubble.robot::after{background:#eafcff}
.bubble strong{color:var(--red)}
.big{font-family:Bangers;font-weight:400;font-size:24px;letter-spacing:.03em;color:var(--blu)}
.ref{font:700 11px 'Comic Neue';color:var(--blu);cursor:pointer;text-decoration:underline;white-space:nowrap}
.char{position:absolute;bottom:-4px;z-index:2}

/* layouts */
.L-A{grid-template-columns:1fr 1fr;grid-template-rows:96px 292px 1fr 1fr;grid-template-areas:"t t" "i s" "e e" "b b"}
.L-B{grid-template-columns:1fr 1fr;grid-template-rows:96px 268px 1fr;grid-template-areas:"t t" "s i" "e b"}
.L-C{grid-template-columns:1.25fr 1fr;grid-template-rows:96px 1fr 1fr;grid-template-areas:"t t" "e i" "e b" }
.a-t{grid-area:t}.a-i{grid-area:i}.a-s{grid-area:s}.a-e{grid-area:e}.a-b{grid-area:b}
.L-C .a-s{display:none}
.L-B .a-e .bubble,.L-B .a-b .bubble{font-size:17px}
.L-C .a-e>.bubble{font-size:17px}

.ntag{position:absolute;z-index:5;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px 2px;font-family:Bangers;font-size:17px;letter-spacing:.06em;color:var(--blu);white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.ntag small{display:block;font:700 9.5px 'Comic Neue';letter-spacing:.08em;color:var(--red);margin-bottom:-3px;text-transform:uppercase}
.ntag::before{content:'';position:absolute;left:22px;bottom:-14px;width:18px;height:14px;background:var(--ink);clip-path:polygon(0 0,100% 0,20% 100%)}
.ntag::after{content:'';position:absolute;left:25px;bottom:-8px;width:12px;height:9px;background:#fff;clip-path:polygon(0 0,100% 0,20% 100%)}
.t-l::before{content:'';position:absolute;left:-29px;top:20px;width:30px;height:26px;background:var(--ink);clip-path:polygon(100% 0,100% 100%,0 15%)}
.t-l::after{content:'';position:absolute;left:-18px;top:25px;width:21px;height:15px;background:#fff;clip-path:polygon(100% 0,100% 100%,0 15%)}
.t-r::before{content:'';position:absolute;right:-29px;top:20px;width:30px;height:26px;background:var(--ink);clip-path:polygon(0 0,0 100%,100% 15%)}
.t-r::after{content:'';position:absolute;right:-18px;top:25px;width:21px;height:15px;background:#eafcff;clip-path:polygon(0 0,0 100%,100% 15%)}
.bubble.t-l::before,.bubble.t-r::before{bottom:auto}
.starring{position:absolute;left:16px;right:16px;top:200px;z-index:4;text-align:center;font-family:Bangers;font-size:31px;letter-spacing:.05em;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.starring span{color:var(--blu);background:#fff;border:3px solid var(--ink);padding:0 10px;-webkit-text-stroke:0;text-shadow:none;box-shadow:3px 3px 0 var(--ink);display:inline-block;transform:rotate(-2deg)}
.credits{background:radial-gradient(circle,rgba(255,255,255,.07) 1.5px,transparent 1.7px) 0 0/10px 10px,linear-gradient(#141a3a,#2a1840);color:#fff;align-items:center;text-align:center}
.credits .jp{font-family:'Noto Serif JP',serif;font-weight:700;letter-spacing:.35em;font-size:15px;color:#ffd23f;margin-top:46px}
.credits h2{font-family:Bangers;font-weight:400;font-size:62px;letter-spacing:.06em;margin:4px 0 26px;color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:4px 4px 0 #e23b2e}
.crow{margin:0 0 24px}
.credits .foot{color:#bbb}.credits .foot b{color:#fff}
.crow .role{font:700 13px 'Comic Neue';letter-spacing:.22em;text-transform:uppercase;color:#9fc2ff}
.crow .name{font-family:Bangers;font-size:32px;letter-spacing:.07em;line-height:1.1}
.crow .name .k{font-family:'Noto Serif JP',serif;font-weight:700;font-size:22px;letter-spacing:.1em;color:#ffd23f}
.credits .rule{width:220px;height:3px;background:linear-gradient(90deg,transparent,#ffd23f,transparent);margin:8px auto 22px}
.credits .cc{font:700 15px 'Comic Neue';line-height:1.5}
.credits .cc a{color:#ffd23f}
.seal{position:absolute;right:50px;bottom:64px;width:150px;transform:rotate(-7deg);z-index:3}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#bar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#stage{touch-action:manipulation}
@media (max-width:560px){#bar{gap:6px;padding-top:6px}#bar button{font-size:17px;padding:6px 12px;min-height:40px}#bar select{font-size:14px;max-width:132px;min-height:40px}#count{min-width:64px;font-size:17px}.hint{display:none}}
@media (max-height:560px) and (orientation:landscape){.hint{display:none}#bar{padding-top:4px}}
/* nav */
#bar{display:flex;gap:10px;align-items:center;padding:10px 12px 14px;flex-wrap:wrap;justify-content:center}
#bar button,#bar select{font-family:Bangers;font-size:20px;letter-spacing:.05em;background:var(--yel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 16px;cursor:pointer;color:var(--ink)}
#bar button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#bar button:disabled{opacity:.4;cursor:default}
#bar select{font-size:16px;padding:5px 8px;background:#fff}
#count{font-family:Bangers;color:#fff;font-size:20px;letter-spacing:.06em;min-width:90px;text-align:center}
.hint{color:#bbb;font-size:12px;width:100%;text-align:center;margin-top:-4px}

/* cover */
.cover{padding:0;background:var(--yel)}
.cover .masthead{background:var(--red);border-bottom:6px solid var(--ink);padding:14px 20px 8px;position:relative}
.cover .masthead h1{margin:0;font-family:Bangers;font-weight:400;font-size:150px;line-height:.85;color:var(--yel);-webkit-text-stroke:4px var(--ink);text-shadow:8px 8px 0 var(--ink);letter-spacing:.02em}
.cover .pub{position:absolute;right:16px;top:14px;text-align:right;font-family:Bangers;color:#fff;font-size:18px;letter-spacing:.05em;line-height:1.1;text-shadow:2px 2px 0 var(--ink)}
.cover .issue{display:inline-block;background:#fff;color:var(--ink);border:3px solid var(--ink);padding:2px 8px;margin-top:6px;font-size:16px;text-shadow:none}
.cover .sub{font:700 20px 'Comic Neue';color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:6px}
.cover .art{position:absolute;left:0;right:0;top:250px;bottom:0;overflow:hidden;background:radial-gradient(circle,rgba(0,0,0,.14) 2px,transparent 2.2px) 0 0/11px 11px,repeating-conic-gradient(from 0deg at 50% 70%,#ffe27a 0 8deg,#ffc93f 8deg 16deg)}
.starb{position:absolute;font-family:Bangers;color:var(--ink);text-align:center;display:flex;align-items:center;justify-content:center;line-height:.95;clip-path:polygon(50% 0,61% 18%,82% 8%,79% 31%,100% 38%,83% 54%,96% 74%,73% 75%,68% 98%,50% 84%,32% 98%,27% 75%,4% 74%,17% 54%,0 38%,21% 31%,18% 8%,39% 18%)}
.cover .lic{position:absolute;left:16px;bottom:44px;background:#fff;border:3px solid var(--ink);padding:6px 10px;font:700 12px/1.25 'Comic Neue';box-shadow:4px 4px 0 var(--ink);z-index:4}
.cover .foot{z-index:4}

/* definitions */
.defs{grid-template-columns:1fr 1fr;grid-template-rows:150px 1fr 1fr 1fr}
.defs .intro{grid-column:1/3}
.def{padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px}
.def .who{font-family:Bangers;font-size:21px;letter-spacing:.04em;color:var(--red);-webkit-text-stroke:.6px var(--ink)}
.def .q{font:700 14px/1.3 'Comic Neue'}
.def .n{position:absolute;right:8px;top:6px;font-family:Bangers;font-size:30px;color:var(--blu);opacity:.85}

/* text pages */
.prose{font:700 15px/1.45 'Comic Neue'}
.srcs{columns:2;column-gap:18px;font:400 10.4px/1.32 'Comic Neue';padding:10px 12px}
.srcs p{margin:0 0 5px;break-inside:avoid}
.srcs a{color:var(--blu);word-break:break-all}
.srcs p.hl{background:var(--yel);outline:2px solid var(--ink)}
a{color:inherit}
</style>
</head>

const star=(x,y,r,f='#ffd23f')=>{let d='';for(let k=0;k<10;k++){const a=Math.PI/5*k-Math.PI/2,rr=k%2?r*.45:r;d+=(k?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${d}Z" fill="${f}" stroke="${C.ink}" stroke-width="2"/>`};
const sparkle=(x,y,r=7)=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="#fff" stroke="${C.ink}" stroke-width="1.8"/>`;
const glass=(hx,hy,cx,cy,r=15)=>`<path d="M${hx} ${hy} L${cx} ${cy}" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(160,220,255,.6)" stroke="${C.ink}" stroke-width="4"/><path d="M${cx-8} ${cy-5} q4 -5 9 -4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`;
const L0=paw(34,172), R0=paw(96,172), SL=[38,148], SR=[92,148];
function arms(a){switch(a){
 case 'magnify': return L0+arm(...SR,112,140,110,128)+glass(110,128,124,104);
 case 'wave': return L0+arm(...SR,126,136,118,102)+`<path d="M130 86 q8 9 0 19 M138 80 q11 14 0 30" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;

 case 'shock': return arm(...SL,14,140,24,114)+arm(...SR,116,140,106,114)+`<path d="M118 46 q8 12 0 18 q-8 -6 0 -18Z" fill="#9fe0ff" stroke="${C.ink}" stroke-width="2"/><text x="-8" y="40" font-family="Bangers" font-size="30" fill="#e23b2e" stroke="${C.ink}" stroke-width="1.5">!!</text>`;
 case 'salute': return L0+arm(...SR,132,118,114,68)+sparkle(130,46);

 case 'cheer': return arm(...SL,8,138,12,102)+arm(...SR,122,138,118,102)+sparkle(-2,82)+sparkle(134,80)+sparkle(126,40,6)+sparkle(4,40,5);
 case 'coin': return L0+arm(...SR,120,140,114,112)+`<circle cx="124" cy="94" r="14" fill="#ffd23f" stroke="${C.ink}" stroke-width="3.5"/><text x="124" y="101" text-anchor="middle" font-family="Bangers" font-size="18" fill="${C.ink}">€</text>`+sparkle(140,78,6);
 case 'gavel': return L0+`<path d="M114 118 L128 80" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><rect x="113" y="68" width="32" height="15" rx="4" fill="#a8672f" stroke="${C.ink}" stroke-width="3" transform="rotate(-22 129 75)"/>`+arm(...SR,120,142,114,118)+`<path d="M140 52 l6 -6 M146 64 h8" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`;
 case 'thumbs': return L0+arm(...SR,120,152,118,140)+`<ellipse cx="119" cy="128" rx="4.5" ry="8" fill="${C.light}" stroke="${C.ink}" stroke-width="3"/>`+sparkle(136,118,6);
}}
function eyes(e){
 const n=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="9.5" ry="11" fill="#2a2140"/><circle cx="${x+3}" cy="${y-5}" r="3.6" fill="#fff"/><circle cx="${x-3}" cy="${y+5}" r="1.8" fill="#fff"/>`;
 const h=(x,y)=>`<path d="M${x-9} ${y+3} q9 -12 18 0" fill="none" stroke="#2a2140" stroke-width="4" stroke-linecap="round"/>`;
 switch(e){
  case 'happy': return h(42,94)+h(88,94);
  case 'wink': return n(42,94)+h(88,94);
  case 'wide': return `<circle cx="42" cy="94" r="12" fill="#fff" stroke="#2a2140" stroke-width="3"/><circle cx="42" cy="94" r="5" fill="#2a2140"/><circle cx="88" cy="94" r="12" fill="#fff" stroke="#2a2140" stroke-width="3"/><circle cx="88" cy="94" r="5" fill="#2a2140"/>`;
  case 'determined': return n(42,95)+n(88,95)+`<path d="M30 76 l20 6 M100 76 l-20 6" stroke="#2a2140" stroke-width="4" stroke-linecap="round"/>`;
  case 'up': return n(44,90)+n(90,90);
  case 'stars': return star(42,94,13)+star(88,94,13);
  default: return n(42,94)+n(88,94);
 }}

}}

 </g>

const stage=document.getElementById('stage');
let html=cover()+meet()+defsPage()+CASES.map(casePage).join('')+closed()+srcPage(1,25,1)+srcPage(26,49,2)+credits()+back();
stage.innerHTML=html;

function fitAll(){
 stage.querySelectorAll('.page').forEach(pg=>{if(pg.style.display!=='none')fitPage(pg)});
}
function fitPage(pg){
 pg.querySelectorAll('[data-fit]').forEach(p=>{try{fitPanel(p)}catch(e){}});
}
function ar(c){const v=c.viewBox.baseVal;return v.height/v.width}
function fitPanel(p){
 const mode=p.dataset.fit, W=p.clientWidth, H=p.clientHeight;
 const bub=p.querySelector(':scope>.bubble');
 const chars=[...p.querySelectorAll(':scope>svg.char')];
 const tag=p.querySelector(':scope>.ntag');
 const bBot=()=>bub?bub.offsetTop+bub.offsetHeight+(bub.classList.contains('whisper')?22:30):0;
 if(mode==='fig'){const img=p.querySelector('img');const z=Math.max(120,Math.min(W-56,H-60));img.style.width=img.style.height=z+'px';return}
 if(mode==='suits'){
  const x0=+(p.dataset.x0||0),RW=W-x0,a=200/90;
  let top=0; if(bub&&bub.offsetLeft+bub.offsetWidth>x0+4) top=bBot();
  const vis=H-top, F=3*0.74+0.26;
  let h=vis*1.45, w=h/a;
  if(w*F>RW-6){w=(RW-6)/F;h=w*a}
  const total=w*F, start=x0+(RW-total)/2, bot=Math.min(-4,vis-h-2);
  chars.forEach((c,i)=>{const hh=i===1?h:h*0.93,ww=hh/a;c.style.width=ww+'px';c.style.left=(start+i*w*0.74+(w-ww)/2)+'px';c.style.right='auto';c.style.bottom=bot+'px';c.style.zIndex=i===1?3:2;c.style.opacity=1;c.style.filter=''});
  return}
 if(mode==='side-l'||mode==='side-r'){
  const c=chars[0],a=ar(c);let w=Math.min((H-2)/a,W*0.38);
  const L=mode==='side-l';
  if(bub){bub.classList.remove('t-bl','t-br');bub.classList.add(L?'t-l':'t-r')}
  for(let k=0;k<10;k++){
   c.style.width=w+'px';
   if(L){c.style.left='6px';if(bub)bub.style.left=(w+24)+'px'}else{c.style.right='8px';c.style.left='auto';if(bub)bub.style.right=(w+26)+'px'}
   if(!bub||bub.offsetTop+bub.offsetHeight<=H-(tag?52:8))break; w*=0.9}
  if(tag){tag.style.left=(w+20)+'px';tag.style.bottom='10px'}
  return}
 if(mode==='stack'){
  const c=chars[0],a=ar(c),inset=p.querySelector(':scope>.inset');
  let top=bBot(), maxw=0.9*W;
  if(inset){const ih=Math.round((H-top)*0.4);inset.style.top=top+'px';inset.style.height=ih+'px';inset.style.bottom='auto';fitPanel(inset);top+=ih+8}
  let h=H-top-(tag?44:0)+4, w=Math.min(h/a,maxw);
  c.style.width=w+'px';
  if(tag){tag.style.left=(c.offsetLeft+w*0.3)+'px';tag.style.bottom=(w*a-14)+'px'}
  return}
 if(mode==='duo'){
  const [c1,c2]=chars;
  const w1=Math.min((H-4)/ar(c1),W*0.3), w2=Math.min((H-4)/ar(c2),W*0.24);
  c1.style.width=w1+'px';c1.style.left='6px';c2.style.width=w2+'px';c2.style.right='10px';c2.style.left='auto';
  if(bub){bub.style.left=(w1+24)+'px';bub.style.right=(w2+30)+'px';bub.classList.remove('t-bl');bub.classList.add('t-l')}
  if(tag){tag.style.left=(w1*0.55)+'px';tag.style.bottom=(H-34)+'px';tag.style.zIndex=6}
  return}
}
fitAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
addEventListener('load',fitAll);
const pages=[...stage.querySelectorAll('.page')];
const N=pages.length;
pages.forEach((p,i)=>p.style.zIndex=N-i);
const SRC1=pages.findIndex(p=>p.dataset.label==='Sources 1');
let cur=0;
const jump=document.getElementById('jump');
pages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${p.dataset.label}`;jump.appendChild(o)});
let hideT=null;
function hideFar(){pages.forEach((p,i)=>{if(Math.abs(i-cur)>1)p.style.display='none'})}
function show(n){
 n=Math.max(0,Math.min(N-1,n));
 const prev=cur;
 [n-1,n,n+1,prev].forEach(i=>{const p=pages[i];if(p&&p.style.display==='none'){p.style.display='';fitPage(p)}});
 void stage.offsetWidth;
 pages.forEach((p,i)=>{
  const f=i<n;
  if(f!==p.classList.contains('flipped')){p.classList.add('flipping');setTimeout(()=>p.classList.remove('flipping'),850)}
  p.classList.toggle('flipped',f);
  // keep the turning page on top while it moves
  p.style.zIndex = f ? (i+1) : (N-i+N);
 });
 cur=n;
 clearTimeout(hideT);hideT=setTimeout(hideFar,850);
 document.getElementById('count').textContent=`${n+1} / ${N}`;
 document.getElementById('prev').disabled=n===0;
 document.getElementById('next').disabled=n===N-1;
 jump.value=n;
 try{history.replaceState(null,'','#p'+(n+1))}catch(e){}
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
jump.onchange=()=>show(+jump.value);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
stage.addEventListener('click',e=>{
 const r=e.target.closest('.ref');
 if(r){const n=+r.dataset.fn;show(n<=25?SRC1:SRC1+1);stage.querySelectorAll('.srcs p').forEach(p=>p.classList.remove('hl'));const t=document.getElementById('fn-'+n);if(t)t.classList.add('hl');return}
 if(e.target.closest('a')||zoomed())return;
 const b=stage.getBoundingClientRect();
 (e.clientX-b.left>b.width/2)?show(cur+1):show(cur-1);
});
// Swipes: normal = flip. Zoomed in = pan freely; at the page edge, a further swipe flips (photo-gallery style).
const vv=window.visualViewport;
const zoomed=()=>!!vv&&vv.scale>1.05;
let sx=null,sy=null,edgeL=true,edgeR=true;
stage.addEventListener('touchstart',e=>{
 if(e.touches.length!==1){sx=null;return}
 sx=e.touches[0].clientX;sy=e.touches[0].clientY;
 if(zoomed()){const W=document.documentElement.clientWidth;edgeL=vv.offsetLeft<=4;edgeR=vv.offsetLeft+vv.width>=W-4}
 else{edgeL=edgeR=true}
},{passive:true});
stage.addEventListener('touchend',e=>{
 if(sx===null)return;
 const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
 if(Math.abs(dx)<45||Math.abs(dx)<1.3*Math.abs(dy))return;
 if(dx<0&&edgeR)show(cur+1);else if(dx>0&&edgeL)show(cur-1);else return;
 stage.dataset.swiped=1;setTimeout(()=>delete stage.dataset.swiped,350);
},{passive:true});
stage.addEventListener('touchcancel',()=>{sx=null},{passive:true});
stage.addEventListener('click',e=>{if(stage.dataset.swiped)e.stopImmediatePropagation()},true);
function fit(){
 const w=document.getElementById('stageWrap');
 const pad=innerWidth<560?4:16;
 const s=Math.min((w.clientWidth-pad)/640,(w.clientHeight-pad)/960);
 stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
const h=/^#p(\d+)$/.exec(location.hash);cur=h?Math.max(0,Math.min(N-1,+h[1]-1)):0;hideFar();show(cur);
</script>
